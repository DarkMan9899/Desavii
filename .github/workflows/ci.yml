# Desavii Armenia — CI pipeline.
#
# `test` runs each workspace's own unit suite only (fast, no real
# services). `integration` (P0.10, Master Roadmap) is what actually
# exercises the MySQL/Redis services below against apps/api's real
# integration Jest project — this was previously never run in CI at all
# despite service containers already being configured on the `test` job
# (provisioned, but nothing ever used them). A fresh
# service container every run means this job can never hit the kind of
# accumulated-local-state staleness a long-lived local `travelhub_test`
# database can (e.g. a fixture user email registered by an earlier local
# run colliding with the same test's next run) — every run starts from
# an empty, freshly-migrated-and-seeded database.
#
# Deploy stages are intentionally absent (BACKEND_ARCHITECTURE.md §58 /
# FRONTEND_ARCHITECTURE.md §38's real deploy targets are wired in a later
# phase, not before there is a real, running environment to deploy to).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs:
      - build
      - test
      - integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/desavii_deploy
          chmod 600 ~/.ssh/desavii_deploy
          ssh-keygen -y -f ~/.ssh/desavii_deploy > /dev/null
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh \
            -i ~/.ssh/desavii_deploy \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo /usr/local/bin/desavii-deploy"
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci_only
          MYSQL_DATABASE: travelhub_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=5s
          --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s
          --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 3306
          DATABASE_NAME: travelhub_test
          DATABASE_USER: root
          DATABASE_PASSWORD: root_ci_only
          REDIS_URL: redis://127.0.0.1:6379

  integration:
    name: Integration Tests (apps/api)
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci_only
          MYSQL_DATABASE: travelhub_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=5s
          --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s
          --health-timeout=5s --health-retries=10
    env:
      NODE_ENV: test
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_NAME_TEST: travelhub_test
      DATABASE_USER: root
      DATABASE_PASSWORD: root_ci_only
      REDIS_URL: redis://127.0.0.1:6379
      # Every var below defaults safely (see config/index.js) — set here
      # only so a real key/URL is never silently required for CI to pass;
      # none of these are real credentials, matching the "local"/dev-only
      # default every one of them already falls back to.
      CONNECTOR_CONFIG_ENCRYPTION_KEY: ci-only-connector-config-key-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test:integration --workspace apps/api
      # tests/contract/ has no test files yet (a dormant Jest project,
      # not wired to anything) — not run here so a genuinely empty
      # category can't masquerade as a passing gate; add this step back
      # once real contract tests exist.
